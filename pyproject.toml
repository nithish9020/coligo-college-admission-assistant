[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coligo-monorepo"
version = "0.1.0"
description = "College Admission Assistant Python Monorepo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "pypdf>=4.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.0",
    "httpx>=0.27.0",
    "bcrypt>=4.1.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "app*"]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.6.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[tool.ruff]
target-version = "py310"
line-length = 88
# data/ holds one-off corpus-generation scripts whose wide numeric tables
# are more readable unwrapped than reflowed to 88 columns.
extend-exclude = ["data"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (import sorting)
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Streamlit view functions are long, linear UI code: each one walks through
# form state, create-vs-edit modes and delete confirmations in sequence.
# Splitting them to satisfy the complexity limit would fragment the page
# layout without making it easier to follow. Everything under api/ stays
# subject to the full rule set.
"administration portal/**" = ["C901"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
