services:
  - type: web
    name: coligo
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PROJECT_NAME
        value: "Coligo College Admission Assistant"
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: ADMIN_NUMBERS
        sync: false
      - key: USE_LANGGRAPH
        value: "true"
      - key: DOCS_URL
        value: /docs
      - key: REDOC_URL
        value: /redoc
      - key: OPENAPI_URL
        value: /openapi.json

  - type: web
    name: coligo-admin-portal
    env: docker
    dockerfilePath: ./Dockerfile.portal
    plan: free
    region: singapore
    envVars:
      # Point the admin portal at the FastAPI backend service
      - key: COLIGO_API_BASE_URL
        value: https://coligo.onrender.com
