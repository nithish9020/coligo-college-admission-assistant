services:
  - type: web
    name: coligo-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PROJECT_NAME
        value: "Coligo College Admission Assistant API"
      - key: DATABASE_URL
        fromDatabase:
          name: coligo-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

databases:
  - name: coligo-db
    plan: free
    region: singapore
    databaseName: dte_chatbot
    user: dte
