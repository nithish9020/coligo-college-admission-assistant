services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: coligo_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dte_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dte_chatbot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dte} -d ${POSTGRES_DB:-dte_chatbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: coligo_api
    env_file: .env
    environment:
      # Override the host-oriented DATABASE_URL from .env: inside the compose
      # network the database is reachable as "postgres", not localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dte}:${POSTGRES_PASSWORD:-dte_secret}@postgres:5432/${POSTGRES_DB:-dte_chatbot}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api:/app/api
      # Source documents to ingest. Reference them from inside the container
      # as /app/data/<file>.pdf when calling POST /documents/process.
      - ./data:/app/data
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log

volumes:
  postgres_data:
