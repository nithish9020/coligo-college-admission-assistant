services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: coligo_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dte_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dte_chatbot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dte} -d ${POSTGRES_DB:-dte_chatbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: coligo_api
    env_file: .env
    environment:
      # Override the host-oriented DATABASE_URL from .env: inside the compose
      # network the database is reachable as "postgres", not localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dte}:${POSTGRES_PASSWORD:-dte_secret}@postgres:5432/${POSTGRES_DB:-dte_chatbot}
    ports:
      # Host port is overridable: `API_PORT=8001 docker compose up -d` avoids
      # clashing with a `make dev` server already holding 8000 on the host.
      - "${API_PORT:-8000}:8000"
    # Explicit upstream resolvers. On hosts running systemd-resolved (Ubuntu,
    # Mint, Fedora) /etc/resolv.conf points at the 127.0.0.53 stub, which is
    # meaningless inside a container - it resolves to the container's own
    # loopback, so every lookup (postgres, Gemini, graph.facebook.com) fails
    # with "Temporary failure in name resolution". Pinning real resolvers here
    # makes the stack work regardless of the host's DNS setup.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api:/app/api
      # Source documents to ingest. Reference them from inside the container
      # as /app/data/<file>.pdf when calling POST /documents/process.
      - ./data:/app/data
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log

volumes:
  postgres_data:
