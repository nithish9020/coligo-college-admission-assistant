name: Deploy to Render

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render Deployment
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy via Render API
        if: env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Triggering Render deployment via REST API for service $RENDER_SERVICE_ID..."
          HTTP_STATUS=$(curl -s -o /tmp/deploy_response.json -w "%{http_code}" \
            -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}')
          cat /tmp/deploy_response.json
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Deploy triggered successfully (HTTP $HTTP_STATUS)."
          else
            echo "Failed to trigger deploy via Render API (HTTP $HTTP_STATUS)."
            exit 1
          fi

      - name: Trigger Deploy via Render Deploy Hook (Fallback)
        if: (env.RENDER_API_KEY == '' || env.RENDER_SERVICE_ID == '') && env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render deployment via webhook..."
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Deploy trigger sent successfully."

      - name: Verify Automatic Git-Deploy Status
        if: (env.RENDER_API_KEY == '' || env.RENDER_SERVICE_ID == '') && env.RENDER_DEPLOY_HOOK_URL == ''
        run: |
          echo "Render API key or deploy hook not configured."
          echo "Render automatically deploys on every push to 'main' when connected to GitHub."
          echo "Repository secrets (DATABASE_URL, GEMINI_API_KEY, WHATSAPP_*) are synced."
